[package]
name = "tapomo"
version = "1.0.0"
description = "Passive typing speed tracker. Never records what you type."
edition.workspace = true
license.workspace = true
repository.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tapomo-core = { path = "../crates/tapomo-core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
# Only for the sleeps of the background update task (tauri already runs on tokio).
tokio = { version = "1", features = ["time"] }
# SQLCipher (with its own OpenSSL) instead of plain SQLite: it reads unencrypted databases too, and
# encrypts them when the user turns on "Cifrar la base de datos" (keystore.rs).
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
getrandom = "0.2"
# Already in the tree through rustls; used to check supporter codes (ed25519).
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
sys-locale = "0.3"
tauri-plugin-notification = "2"

[target.'cfg(windows)'.dependencies]
windows-core = "0.58"
windows = { version = "0.58", features = [
    "implement",
    "ApplicationModel",
    "ApplicationModel_Activation",
    "Foundation",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
