# Tapomo API — Cloudflare Workers + D1 (plan gratuito).
# Pasos completos en server/README.md. Desplegar de nuevo: `cd server && npx wrangler deploy` con CLOUDFLARE_API_TOKEN.

name = "tapomo-api"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Sin account_id: wrangler lo saca del token (CLOUDFLARE_API_TOKEN, en el VPS en ~/.config/cloudflare-api-token).
# Solo responde en api.tapomo.app (desplegado el 13-11-2026), no en workers.dev.
workers_dev = false

# Dominio propio: Cloudflare crea el DNS y el certificado solo.
routes = [
  { pattern = "api.tapomo.app", custom_domain = true }
]

[[d1_databases]]
binding = "DB"
database_name = "tapomo"
# Base de datos D1 creada en Europa occidental (weur).
database_id = "b10a317f-4adf-4a7f-84b1-5a0419f0f828"

# Limpieza (retención) y reconstrucción del histograma de percentiles: cada hora, al minuto 17.
[triggers]
crons = ["17 * * * *"]

# Límites de peticiones por IP (la IP nunca se guarda; ver README). Opcionales: estos son los valores por defecto.
[vars]
RATE_WINDOW_SEC = "600"
RATE_MAX = "120"
RATE_MAX_LEAGUE_WRITES = "20"

# Secreto (no va aquí): `npx wrangler secret put RATE_LIMIT_SALT` con un valor aleatorio largo.
# Sin él, el Worker usa una sal fija de desarrollo y los hashes de IP serían más fáciles de revertir.
