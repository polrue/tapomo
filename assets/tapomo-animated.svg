<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <style>
    .sh,.body,.eyes,.sp,.ln{animation-duration:5s;animation-iteration-count:infinite}
    .sh{transform-origin:80px 142px;animation-name:sh}
    .body{transform-origin:80px 138px;animation-name:bd;animation-timing-function:ease-in-out}
    .eyes{transform-origin:80px 84px;animation-name:bl}
    .sp,.ln{opacity:0}
    .sp{transform-box:fill-box;transform-origin:50% 50%;animation-name:sp}
    .s2{animation-delay:.18s}
    .ln{animation-name:ln}
    @keyframes bd{
      0%,40%,100%{transform:none}
      8%{transform:scale(1.06,.93)}
      18%{transform:translateY(-8px) scale(.96,1.05)}
      28%{transform:scale(1.07,.92)}
      34%{transform:scale(.98,1.03)}
      62%{transform:none}
      68%{transform:scale(1.03,.97)}
      72%,76%{transform:scale(1.09,.86)}
      82%{transform:scale(.97,1.05)}
      90%{transform:scale(1.01,.99)}
    }
    @keyframes sh{
      0%,40%,62%,100%{transform:none;opacity:.12}
      18%{transform:scaleX(.8);opacity:.07}
      28%{transform:scaleX(1.06)}
      74%{transform:scaleX(1.1)}
    }
    @keyframes bl{0%,47%,53%,100%{transform:none}50%{transform:scaleY(.1)}}
    @keyframes sp{
      0%,70%,100%{opacity:0;transform:scale(0) rotate(0)}
      78%{opacity:1;transform:scale(1.15) rotate(20deg)}
      92%{opacity:0;transform:scale(.6) rotate(50deg)}
    }
    @keyframes ln{0%,70%,100%{opacity:0}74%{opacity:.9}84%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.sh,.body,.eyes,.sp,.ln{animation:none}}
  </style>
  <ellipse class="sh" cx="80" cy="142" rx="38" ry="4" fill="#23202b" opacity=".12"/>
  <g class="body">
    <rect x="30" y="40" width="100" height="98" rx="30" fill="#ff9e7a"/>
    <rect x="40" y="46" width="80" height="72" rx="22" fill="#ffffff" opacity=".28"/>
    <g class="eyes">
      <circle cx="62" cy="84" r="7" fill="#23202b"/><circle cx="98" cy="84" r="7" fill="#23202b"/>
      <circle cx="64" cy="82" r="2.4" fill="#fff"/><circle cx="100" cy="82" r="2.4" fill="#fff"/>
    </g>
    <circle cx="50" cy="98" r="7" fill="#ff6f61" opacity=".45"/><circle cx="110" cy="98" r="7" fill="#ff6f61" opacity=".45"/>
    <path d="M72 100 Q80 108 88 100" stroke="#23202b" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  </g>
  <g stroke="#ff9e7a" stroke-width="3" stroke-linecap="round">
    <path class="ln" d="M22 132l-8 3M22 124l-9-2M138 132l8 3M138 124l9-2"/>
  </g>
  <path class="sp" d="M142 30l2.5 6.5 6.5 2.5-6.5 2.5-2.5 6.5-2.5-6.5-6.5-2.5 6.5-2.5z" fill="#ffc93c"/>
  <path class="sp s2" d="M20 46l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#ffc93c"/>
</svg>
