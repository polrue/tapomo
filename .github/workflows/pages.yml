name: Web (GitHub Pages)

# Publishes web/ (tapomo.app). Manual for now: GitHub Pages has to be enabled first
# (Settings → Pages → Source: GitHub Actions) and the tapomo.app DNS pointed at GitHub.
# Once that is done, add `push: { branches: [main], paths: ['web/**'] }` below.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
