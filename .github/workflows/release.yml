name: Release

# Push a tag like v0.3.1 (matching the version in src-tauri/Cargo.toml) to build, attest and publish a release.
# Release notes come from docs/releases/<tag>.md; a "Verification" section is appended automatically
# (SHA-256, build provenance attestation and, if the VT_API_KEY secret is set, the VirusTotal result).

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      attestation-url: ${{ steps.attest.outputs.attestation-url }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches the app version
        shell: bash
        run: |
          version=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match src-tauri/Cargo.toml version $version"
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npx tauri build
      # Updater signature (minisign, made with the Tauri updater key): the installed app verifies it against
      # the public key in tauri.conf.json before running a downloaded update. It signs the exact bytes of the
      # .exe, so any future Authenticode signing (SignPath) must happen BEFORE this step, never after.
      - name: Sign the installer for the updater
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for exe in target/release/bundle/nsis/*.exe; do
            npx tauri signer sign "$exe"
            test -s "$exe.sig"
          done
      - id: attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: target/release/bundle/nsis/*.exe
      - uses: actions/upload-artifact@v7
        with:
          name: tapomo-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Manual approval: the "release" environment requires Pol's review before anything is published.
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: tapomo-windows
          path: dist
      - name: Create the release
        run: |
          exe=$(ls dist/*.exe)
          sha=$(sha256sum "$exe" | cut -d' ' -f1)
          echo "EXE=$exe" >> "$GITHUB_ENV"
          echo "SHA=$sha" >> "$GITHUB_ENV"
          notes="docs/releases/$TAG.md"
          if [ -f "$notes" ]; then cp "$notes" notes.md; else echo "Tapomo $TAG" > notes.md; fi
          cat >> notes.md <<EOF

          ---

          **Verificación / Verification**

          - SHA-256 (\`$(basename "$exe")\`): \`$sha\`
          - Compilado por GitHub Actions desde el commit $GITHUB_SHA ([certificación de procedencia / provenance attestation](${{ needs.build.outputs.attestation-url }})). Comprobar / verify: \`gh attestation verify $(basename "$exe") -R $GITHUB_REPOSITORY\`
          EOF
          # Same file under a fixed name, so releases/latest/download/Tapomo-setup.exe always works
          cp "$exe" dist/Tapomo-setup.exe
          # latest.json is what the installed apps read (releases/latest/download/latest.json) to find the update.
          first_paragraph=$(awk 'BEGIN { RS = "" } !/^#/ { print; exit }' "$notes" 2>/dev/null || true)
          jq -n \
            --arg version "${TAG#v}" \
            --arg notes "${first_paragraph:-Tapomo $TAG}" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg signature "$(cat "$exe.sig")" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$(basename "$exe")" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: {"windows-x86_64": {signature: $signature, url: $url}}}' > dist/latest.json
          cat dist/latest.json
          gh release create "$TAG" "$exe" "$exe.sig" dist/latest.json dist/Tapomo-setup.exe --title "Tapomo ${TAG#v}" --notes-file notes.md --verify-tag
      - name: Scan with VirusTotal
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          if [ -z "$VT_API_KEY" ]; then echo "VT_API_KEY not set, skipping"; exit 0; fi
          link="https://www.virustotal.com/gui/file/$SHA"
          analysis=$(curl -sf -H "x-apikey: $VT_API_KEY" -F "file=@$EXE" https://www.virustotal.com/api/v3/files | jq -r .data.id) || true
          if [ -z "$analysis" ] || [ "$analysis" = null ]; then echo "VirusTotal upload failed, skipping"; exit 0; fi
          # The free API allows 4 requests a minute; a scan usually finishes in 1-5 minutes.
          for i in $(seq 1 40); do
            sleep 30
            result=$(curl -sf -H "x-apikey: $VT_API_KEY" "https://www.virustotal.com/api/v3/analyses/$analysis") || continue
            [ "$(jq -r .data.attributes.status <<<"$result")" = completed ] && break
            result=""
          done
          if [ -n "$result" ]; then
            flagged=$(jq '.data.attributes.stats | (.malicious // 0) + (.suspicious // 0)' <<<"$result")
            total=$(jq '.data.attributes.stats | (.malicious // 0) + (.suspicious // 0) + (.undetected // 0) + (.harmless // 0)' <<<"$result")
            if [ "$flagged" -eq 0 ]; then
              line="- ✅ VirusTotal: ningún antivirus lo detecta / no engine flags it (0/$total, $(date -u +%F)) — [informe / report]($link)"
            else
              line="- VirusTotal: $flagged/$total detecciones / detections ($(date -u +%F)) — [informe / report]($link)"
            fi
          else
            line="- VirusTotal: [informe / report]($link)"
          fi
          gh release view "$TAG" --json body -q .body > body.md
          echo "$line" >> body.md
          gh release edit "$TAG" --notes-file body.md
