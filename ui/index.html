<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tapomo</title>
  <link rel="stylesheet" href="mascot.css">
  <link rel="stylesheet" href="wardrobe.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="xp.css">
  <link rel="stylesheet" href="badges.css">
  <link rel="stylesheet" href="league.css">
  <link rel="stylesheet" href="records.css">
  <link rel="stylesheet" href="keyboard.css">
  <link rel="stylesheet" href="lessons.css">
  <link rel="stylesheet" href="support.css">
  <link rel="stylesheet" href="nav.css">
</head>
<body>
  <div class="sticky-head" id="sticky-head">
  <header class="top">
    <div class="mascot-wrap" id="mascot-wrap"><svg id="mascot" viewBox="0 0 160 160" role="img" aria-label="Tapomo"></svg></div>
    <div class="brand">
      <h1>Tapomo</h1>
      <p class="ver-line"><a id="version-link" class="ver" href="#" target="_blank" rel="noopener" data-i18n-title="version.title" hidden></a><button type="button" id="update-pill" class="pill" hidden></button></p>
      <p class="hide-note" id="hide-note" aria-live="polite" hidden><span id="hide-text"></span><button type="button" class="pill" id="hide-btn" hidden></button></p>
      <p class="tagline" id="paused-banner" hidden data-i18n="paused.banner"></p>
    </div>
    <button type="button" class="lessons-btn" id="lessons-btn" aria-pressed="false" data-i18n="lessons.button"></button>
    <nav class="tabs" id="range-tabs" role="tablist">
      <button role="tab" data-range="today" data-i18n="range.today"></button>
      <button role="tab" data-range="7d" data-i18n="range.7d"></button>
      <button role="tab" data-range="30d" data-i18n="range.30d"></button>
      <button role="tab" data-range="all" data-i18n="range.all"></button>
    </nav>
  </header>
  <nav class="section-nav" id="section-nav" data-i18n-aria="nav.sections"><ul class="sn-list" id="sn-list"></ul></nav>
  </div>

  <main>
    <section class="card lessons" id="lessons" aria-labelledby="ls-title">
      <div class="ls-head">
        <h2 id="ls-title" data-i18n="lessons.title"></h2>
        <label class="ls-layout-pick"><span data-i18n="lessons.layout"></span>
          <select id="ls-layout"><option value="es" data-i18n="lessons.layout.es"></option><option value="us" data-i18n="lessons.layout.us"></option><option value="fr" data-i18n="lessons.layout.fr"></option><option value="de" data-i18n="lessons.layout.de"></option></select>
        </label>
        <button type="button" class="ghost" id="ls-close" data-i18n="lessons.close"></button>
      </div>
      <div id="ls-map">
        <p class="hint" data-i18n="lessons.intro"></p>
        <p class="ls-real" id="ls-real" hidden></p>
        <div class="ls-practice" id="ls-practice" hidden>
          <div><strong data-i18n="lessons.practice.title"></strong><p class="hint" data-i18n="lessons.practice.text"></p></div>
          <span class="ls-practice-keys" id="ls-practice-keys"></span>
          <button type="button" id="ls-practice-go" data-i18n="lessons.practice.go"></button>
        </div>
        <div class="ls-units" id="ls-units"></div>
      </div>
      <div id="ls-run" hidden>
        <div class="ls-run-head"><h3 id="ls-run-title"></h3><span class="ls-live"><span data-i18n="unit.wpm"></span> <strong id="ls-wpm">–</strong> · <span data-i18n="lessons.accuracy"></span> <strong id="ls-acc">100 %</strong></span></div>
        <div class="ls-progress"><i id="ls-bar"></i></div>
        <div class="ls-text" id="ls-text" aria-live="off"></div>
        <input class="ls-input" id="ls-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" data-i18n-aria="lessons.input">
        <p class="hint" data-i18n="lessons.run_hint"></p>
        <div class="ls-kb" id="ls-kb"></div>
      </div>
      <div id="ls-result" class="ls-result" hidden aria-live="polite">
        <div class="ls-res-stars" id="ls-res-stars"></div>
        <h3 id="ls-res-title"></h3>
        <p id="ls-res-line"></p>
        <p class="hint" id="ls-res-tip"></p>
        <div class="ls-res-nav">
          <button type="button" class="ghost" id="ls-back" data-i18n="lessons.back"></button>
          <button type="button" class="ghost" id="ls-again" data-i18n="lessons.again"></button>
          <button type="button" id="ls-next" data-i18n="lessons.next"></button>
        </div>
      </div>
    </section>

    <section class="card live" id="live" data-zone="idle" aria-live="off">
      <div class="live-head">
        <h2><span data-i18n="live.title"></span><button type="button" class="info" data-tip="tip.live" data-tip-speed="live" data-i18n-aria="tip.more">i</button></h2>
        <span class="live-zone" id="live-zone"></span>
      </div>
      <div class="live-body">
        <div class="live-num"><strong id="live-wpm">–</strong><span class="unit" data-i18n="unit.wpm"></span></div>
        <div class="live-bar-wrap">
          <span class="live-label live-label-pace" id="live-pace-label" data-i18n="live.pace"></span>
          <div class="live-bar" id="live-bar" role="meter" aria-valuemin="0" aria-valuemax="130" aria-valuenow="0" data-i18n-aria="live.bar">
            <div class="live-fill" id="live-fill"></div>
            <div class="live-tick" id="live-tick"></div>
            <div class="live-record" id="live-record" hidden></div>
          </div>
          <span class="live-label live-label-record" id="live-record-label" hidden></span>
        </div>
      </div>
      <div class="live-note"><p class="live-text" id="live-text"></p><button type="button" class="info" id="live-burst-info" data-tip="tip.longburst" data-i18n-aria="tip.more" hidden>i</button></div>
    </section>

    <section class="card goal" id="goal" aria-labelledby="goal-title" hidden>
      <h2 class="sr" id="goal-title" data-i18n="goal.title"></h2>
      <div class="goal-ring" id="goal-ring">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <circle class="goal-track" cx="50" cy="50" r="42"></circle>
          <circle class="goal-arc" id="goal-arc" cx="50" cy="50" r="42"></circle>
        </svg>
        <strong id="goal-pct"></strong>
      </div>
      <div class="goal-text">
        <p class="goal-progress" id="goal-progress" role="progressbar" aria-valuemin="0"></p>
        <p class="goal-sub" id="goal-sub"></p>
      </div>
      <div class="goal-streak">
        <svg class="flame" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c.6 3.2 3.6 5 5.2 8.2 1.7 3.3.4 8.3-5.2 8.3-4.8 0-7-3.8-5.7-7.4.5 1.2 1.3 1.9 2.3 2.1C7.9 9.8 10.4 6.4 12 2z"></path><path class="flame-core" d="M12 13c.4 1.6 2.3 2.4 2.3 4.3 0 1.6-1.1 2.7-2.3 2.7s-2.3-1.1-2.3-2.7c0-1.3.7-1.9 1.2-2.7.3-.4.9-.9 1.1-1.6z"></path></svg>
        <div>
          <p class="goal-days" id="goal-days"></p>
          <p class="goal-saved" id="goal-saved" hidden></p>
        </div>
      </div>
    </section>

    <section class="card level" id="level" aria-labelledby="lv-label" hidden>
      <div class="lv-badge"><span id="lv-label" data-i18n="level.title"></span><strong id="lv-num"></strong></div>
      <div class="lv-body">
        <div class="lv-row"><span class="lv-xp" id="lv-xp"></span><span class="lv-today" id="lv-today" hidden></span></div>
        <div class="lv-bar" id="lv-bar" role="progressbar" aria-valuemin="0" data-i18n-aria="level.title"><i id="lv-fill"></i></div>
        <p class="lv-next" id="lv-next"></p>
      </div>
    </section>

    <section class="card league" id="league" aria-labelledby="lg-name" hidden>
      <div class="lg-emblem" id="lg-emblem"></div>
      <div class="lg-body">
        <div class="lg-head"><h2 class="lg-name" id="lg-name"></h2><span class="lg-days" id="lg-days"></span></div>
        <p class="lg-text" id="lg-text"></p>
        <div class="lg-bar" id="lg-bar" role="progressbar" aria-valuemin="0" data-i18n-aria="league.bar" hidden><i id="lg-fill"></i></div>
        <button type="button" class="link lg-letter" id="lg-letter" data-i18n="weekly.open"></button>
      </div>
    </section>

    <section class="card sc-tip" id="sc-tip" aria-labelledby="sc-tip-title" hidden>
      <div>
        <h2 id="sc-tip-title" data-i18n="album.tip_title"></h2>
        <p><kbd id="sc-tip-keys"></kbd> <span id="sc-tip-text"></span></p>
      </div>
      <div class="sc-tip-nav">
        <button type="button" class="ghost" id="sc-tip-known" data-i18n="album.known"></button>
        <button type="button" id="sc-tip-ok" data-i18n="album.thanks"></button>
      </div>
    </section>

    <section class="card shortcuts" id="shortcuts" aria-labelledby="sc-title" hidden>
      <div class="sc-head">
        <h2><span id="sc-title" data-i18n="shortcuts.title"></span><button type="button" class="info" data-tip="tip.shortcuts" data-i18n-aria="tip.more">i</button></h2>
        <strong class="sc-total" id="sc-total"></strong>
      </div>
      <p class="sc-line muted" id="sc-line"></p>
      <ul class="chips sc-kinds" id="sc-kinds"></ul>
    </section>

    <section class="card challenges" id="challenges" aria-labelledby="ch-title" hidden>
      <h2><span id="ch-title" data-i18n="ch.title"></span><button type="button" class="info" data-tip="tip.challenges" data-i18n-aria="tip.more">i</button></h2>
      <ul class="ch-list" id="ch-list"></ul>
      <p class="ch-full" id="ch-full" hidden></p>
    </section>

    <p id="social-percentile" class="social-percentile" hidden></p>
    <p id="yesterday" class="muted yesterday" hidden></p>

    <section id="empty" class="empty" hidden>
      <h2 data-i18n="empty.title"></h2>
      <p><span data-i18n="empty.text"></span><button type="button" class="info" data-tip="tip.burst" data-i18n-aria="tip.more">i</button></p>
    </section>

    <div id="data">
      <section class="tiles" id="tiles">
        <article class="tile big">
          <span class="label"><span data-i18n="tile.avg"></span><button type="button" class="info" data-tip="tip.avg" data-tip-speed="avg" data-i18n-aria="tip.more">i</button></span>
          <strong id="t-avg">–</strong>
          <small id="t-net"></small>
          <small id="t-cpm"></small>
        </article>
        <article class="tile">
          <span class="label"><span data-i18n="tile.peak"></span><button type="button" class="info" data-tip="tip.peak" data-tip-speed="peak" data-i18n-aria="tip.more">i</button></span>
          <strong id="t-peak">–</strong>
          <small id="t-peak-cpm"></small>
        </article>
        <article class="tile">
          <span class="label"><span data-i18n="tile.best"></span><button type="button" class="info" data-tip="tip.best" data-i18n-aria="tip.more">i</button></span>
          <strong id="t-best">–</strong>
        </article>
        <article class="tile">
          <span class="label"><span data-i18n="tile.current"></span><button type="button" class="info" data-tip="tip.current" data-i18n-aria="tip.more">i</button></span>
          <strong id="t-current">–</strong>
        </article>
        <article class="tile">
          <span class="label"><span data-i18n="tile.time"></span><button type="button" class="info" data-tip="tip.time" data-i18n-aria="tip.more">i</button></span>
          <strong id="t-time">–</strong>
        </article>
        <article class="tile">
          <span class="label"><span data-i18n="tile.chars"></span><button type="button" class="info" data-tip="tip.chars" data-i18n-aria="tip.more">i</button></span>
          <strong id="t-chars">–</strong>
        </article>
      </section>

      <section class="card">
        <h2><span data-i18n="heatmap.title"></span><button type="button" class="info" data-tip="tip.heatmap" data-i18n-aria="tip.more">i</button></h2>
        <div id="heatmap" class="heatmap" role="group" data-i18n-aria="heatmap.title"></div>
        <div id="heatmap-legend" class="heat-legend" hidden>
          <span class="chip"><i data-zone="warming"></i><span data-i18n="heatmap.z.warming"></span></span>
          <span class="chip"><i data-zone="rhythm"></i><span data-i18n="heatmap.z.rhythm"></span></span>
          <span class="chip"><i data-zone="good"></i><span data-i18n="heatmap.z.good"></span></span>
          <span class="chip"><i data-zone="fire"></i><span data-i18n="heatmap.z.fire"></span></span>
          <span class="chip"><i data-zone="beating"></i><span data-i18n="heatmap.z.beating"></span></span>
          <span class="chip"><i data-zone="super"></i><span data-i18n="heatmap.z.super"></span></span>
          <span class="chip more"><i class="ramp"></i><span data-i18n="heatmap.more"></span></span>
        </div>
        <p id="heatmap-note" class="muted heat-note" data-i18n="heatmap.calibrating" hidden></p>
      </section>

      <section class="card">
        <h2><span data-i18n="apps.title"></span><button type="button" class="info" data-tip="tip.apps" data-i18n-aria="tip.more">i</button></h2>
        <table class="apps">
          <thead>
            <tr><th data-i18n="apps.app"></th><th class="num" data-i18n="apps.wpm"></th><th class="num" data-i18n="apps.chars"></th></tr>
          </thead>
          <tbody id="apps-body"></tbody>
        </table>
        <p id="apps-empty" class="muted" data-i18n="apps.empty" hidden></p>
      </section>
    </div>

    <section class="card badges" id="badges" aria-labelledby="bd-title">
      <h2><span id="bd-title" data-i18n="badges.title"></span><button type="button" class="info" data-tip="tip.badges" data-i18n-aria="tip.more">i</button></h2>
      <p class="bd-count" id="bd-count"></p>
      <ul class="bd-grid" id="bd-grid"></ul>
    </section>

    <section class="card records" id="records" aria-labelledby="rc-title" hidden>
      <h2><span id="rc-title" data-i18n="records.title"></span><button type="button" class="info" data-tip="tip.records" data-i18n-aria="tip.more">i</button></h2>
      <ul class="rc-grid" id="rc-grid"></ul>
    </section>

    <details class="card album" id="album">
      <summary><h2 data-i18n="album.title"></h2></summary>
      <p class="hint" data-i18n="album.hint"></p>
      <p class="al-count" id="al-count"></p>
      <div id="al-grid"></div>
    </details>

    <details class="card friends" id="friends">
      <summary><h2 data-i18n="social.leagues"></h2></summary>
      <p class="hint" data-i18n="social.leagues.hint"></p>
      <div id="lf-join">
        <div class="lf-form">
          <label><span data-i18n="social.nickname"></span><input id="lf-nick" maxlength="24" autocomplete="off"></label>
          <label><span data-i18n="social.league_name"></span><input id="lf-name" maxlength="40" autocomplete="off"></label>
          <button type="button" id="lf-create" data-i18n="social.create"></button>
        </div>
        <div class="lf-form">
          <label><span data-i18n="social.code"></span><input id="lf-code" maxlength="8" autocomplete="off" spellcheck="false"></label>
          <button type="button" class="ghost" id="lf-join-btn" data-i18n="social.join"></button>
        </div>
        <p class="lf-error" id="lf-error" role="alert" hidden></p>
      </div>
      <div id="lf-board" hidden>
        <h3 id="lf-title"></h3>
        <p class="hint"><span data-i18n="social.share_code"></span> <strong class="lf-code" id="lf-code-show"></strong> <button type="button" class="pill" id="lf-copy" data-i18n="social.copy"></button></p>
        <ol class="lf-list" id="lf-list"></ol>
        <p class="hint" id="lf-offline" data-i18n="social.offline" hidden></p>
        <button type="button" class="ghost" id="lf-leave" data-i18n="social.leave"></button>
      </div>
    </details>

    <details class="card wardrobe" id="wardrobe">
      <summary><h2 data-i18n="wd.title"></h2></summary>
      <p class="hint" data-i18n="wd.hint"></p>
      <fieldset class="wd-style">
        <legend data-i18n="wd.style"></legend>
        <label><input type="radio" name="wd-style" value="bold"><span data-i18n="wd.style.bold"></span></label>
        <label><input type="radio" name="wd-style" value="subtle"><span data-i18n="wd.style.subtle"></span></label>
      </fieldset>
      <p class="hint" data-i18n="wd.style.hint"></p>
      <h3 data-i18n="wd.skins"></h3>
      <div class="wd-grid" id="wd-skins"></div>
      <h3 data-i18n="wd.accessories"></h3>
      <p class="wd-removed" id="wd-removed" aria-live="polite" hidden></p>
      <div class="wd-grid" id="wd-accs"></div>
    </details>

    <section class="card support" id="support" aria-labelledby="sp-title">
      <div class="sp-art"><svg id="sp-mascot" viewBox="0 0 160 160" aria-hidden="true"></svg><span class="sp-heart" aria-hidden="true">💗</span></div>
      <div class="sp-body">
        <h2 id="sp-title" data-i18n="support.title"></h2>
        <div id="sp-ask">
          <p data-i18n="support.text"></p>
          <p class="sp-buttons">
            <a class="sp-btn" id="sp-kofi" href="#" target="_blank" rel="noopener" data-i18n="support.kofi"></a>
            <a class="sp-btn ghost" id="sp-sponsors" href="#" target="_blank" rel="noopener" data-i18n="support.sponsors"></a>
          </p>
          <p class="hint" data-i18n="support.perk"></p>
        </div>
        <p class="sp-thanks" id="sp-thanks" data-i18n="support.thanks" hidden></p>
        <details class="sp-code-box">
          <summary data-i18n="support.have_code"></summary>
          <div class="sp-code-row"><input id="sp-code" autocomplete="off" spellcheck="false" data-i18n-placeholder="support.code_ph"><button type="button" id="sp-redeem" data-i18n="support.redeem"></button></div>
          <p class="hint" id="sp-msg" aria-live="polite" hidden></p>
        </details>
      </div>
    </section>

    <section class="card" id="settings">
      <h2 data-i18n="settings.title"></h2>

      <div class="row">
        <span class="lbl"><label for="s-pause" data-i18n="settings.pause"></label><button type="button" class="info" data-tip="tip.burst" data-i18n-aria="tip.more">i</button></span>
        <div class="slider"><input id="s-pause" type="range" min="1" max="5" step="0.5"><output id="s-pause-out"></output></div>
      </div>
      <p class="hint" data-i18n="settings.pause.hint"></p>

      <div class="row">
        <label for="s-language" data-i18n="settings.language"></label>
        <select id="s-language"></select>
      </div>

      <div class="row">
        <span class="lbl"><label for="s-goal" data-i18n="settings.goal"></label><button type="button" class="info" data-tip="tip.goal" data-i18n-aria="tip.more">i</button></span>
        <select id="s-goal">
          <option value="0" data-i18n="settings.goal.0"></option>
          <option value="10" data-i18n="settings.goal.10"></option>
          <option value="20" data-i18n="settings.goal.20"></option>
          <option value="30" data-i18n="settings.goal.30"></option>
        </select>
      </div>
      <p class="hint" data-i18n="settings.goal.hint"></p>
      <label class="check"><input id="s-lessons-goal" type="checkbox"><span data-i18n="settings.lessons_in_goal"></span></label>
      <label class="check"><input id="s-weekend" type="checkbox"><span data-i18n="settings.weekend_rest"></span></label>
      <p class="hint" data-i18n="settings.weekend_rest.hint"></p>

      <label class="check"><input id="s-shortcuts" type="checkbox"><span data-i18n="settings.count_shortcuts"></span></label>
      <p class="hint" data-i18n="settings.count_shortcuts.hint"></p>
      <label class="check"><input id="s-sc-tips" type="checkbox"><span data-i18n="settings.shortcut_tips"></span></label>
      <label class="check"><input id="s-autostart" type="checkbox"><span data-i18n="settings.autostart"></span></label>
      <label class="check"><input id="s-fullscreen" type="checkbox"><span data-i18n="settings.fullscreen"></span></label>
      <p class="hint" data-i18n="settings.fullscreen.hint"></p>
      <label class="check"><input id="s-paused" type="checkbox"><span data-i18n="settings.paused"></span></label>
      <label class="check"><input id="s-pet" type="checkbox"><span data-i18n="settings.show_pet"></span></label>
      <p class="hint" data-i18n="settings.show_pet.hint"></p>
      <label class="check"><input id="s-updates" type="checkbox"><span data-i18n="settings.check_updates"></span></label>
      <p class="hint" data-i18n="settings.check_updates.hint"></p>
      <label class="check"><input id="s-auto-update" type="checkbox"><span data-i18n="settings.auto_update"></span></label>
      <p class="hint" data-i18n="settings.auto_update.hint"></p>

      <h3 data-i18n="crypt.title"></h3>
      <p class="hint" id="crypt-status"></p>
      <p><button type="button" class="ghost" id="crypt-btn" data-i18n="crypt.button"></button></p>

      <h3 data-i18n="social.title"></h3>
      <label class="check"><input id="s-social-stats" type="checkbox"><span data-i18n="social.stats"></span></label>
      <p class="hint" data-i18n="social.stats.hint"></p>
      <p><button type="button" class="ghost" id="social-delete" data-i18n="social.delete"></button></p>
      <p class="hint" id="social-note" aria-live="polite" hidden></p>

      <h3 data-i18n="settings.logs"></h3>
      <p class="hint" data-i18n="settings.logs.hint"></p>
      <button type="button" id="open-logs" data-i18n="settings.logs.open"></button>

      <h3 data-i18n="settings.exclusions"></h3>
      <p class="hint" data-i18n="settings.exclusions.hint"></p>
      <ul id="exclusions" class="chips"></ul>
      <form id="exclusion-form" class="inline-form">
        <input id="exclusion-input" type="text" autocomplete="off" spellcheck="false" data-i18n-placeholder="settings.exclusions.placeholder">
        <button type="submit" data-i18n="settings.exclusions.add"></button>
      </form>
    </section>

    <details class="card glossary" id="glossary">
      <summary><h2 data-i18n="gloss.title"></h2></summary>
      <dl id="glossary-list"></dl>
    </details>

    <section class="card about">
      <h2 data-i18n="about.title"></h2>
      <p id="about-version" class="muted"></p>
      <p class="privacy" data-i18n="about.privacy"></p>
